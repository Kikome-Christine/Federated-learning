[workspace]
members = [
    "crates/flproto",
    "crates/flcommon",
    "crates/participant",
    "crates/scheduler",
    "crates/coordinator",
    "crates/flsim",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tonic = "0.12"
prost = "0.13"
serde_json = "1"
hdrhistogram = { version = "7", default-features = false }

[profile.release]
opt-level = 3
debug = false
lto = "thin"
